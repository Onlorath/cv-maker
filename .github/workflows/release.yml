name: Release - Build & Publish Multiplatform Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Portable .exe & NSIS Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Program Files\NSIS") {
            "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Windows Application
        run: |
          wails build -platform windows/amd64 -nsis -clean

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          cd build/bin
          Compress-Archive -Path cv_maker.exe -DestinationPath cv_maker-windows-amd64.zip -Force
          $installer = Get-ChildItem -Filter "*installer*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "cv_maker-windows-installer.exe"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            build/bin/cv_maker-windows-amd64.zip
            build/bin/cv_maker-windows-installer.exe

  build-macos:
    name: Build macOS (Universal App Bundle)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build macOS Universal App
        run: |
          wails build -platform darwin/universal -clean || (xattr -cr build/bin/cv_maker.app 2>/dev/null && codesign --force --deep --sign - build/bin/cv_maker.app)

      - name: Package macOS App
        run: |
          cd build/bin
          xattr -cr cv_maker.app 2>/dev/null || true
          codesign --force --deep --sign - cv_maker.app 2>/dev/null || true
          zip -r -y -q cv_maker-macos-universal.zip cv_maker.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: build/bin/cv_maker-macos-universal.zip

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        working-directory: ./frontend
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package Android APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/cv_maker-android-debug.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist-apk/cv_maker-android-debug.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Inspect Dist Release Directory
        run: ls -la dist-release/

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "TAG_NAME=latest" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
