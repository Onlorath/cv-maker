name: Android APK - Fast Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        working-directory: ./frontend
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package Android APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/cv_maker-android-debug.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv_maker-android-debug
          path: dist-apk/cv_maker-android-debug.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Pre-Release"
          files: dist-apk/cv_maker-android-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
